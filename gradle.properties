# Committed, machine-independent settings. Machine-specific values (aapt2 override,
# signing file location) go in local.properties / ~/.gradle/gradle.properties or -P flags.
# Sized for a small (8 GB, 2 vCPU) sandbox shared with other builds.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=640m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.workers.max=1
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
